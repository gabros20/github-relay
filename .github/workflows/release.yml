name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip the release run on semantic-release's own version-bump commits.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run checks
        run: bun run check

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # @semantic-release/npm's verifyConditions runs `npm whoami` even under
          # --dry-run, so dry-run is NOT actually token-free with the npm plugin
          # in the chain (it fails ENEEDAUTH / "Invalid npm token" with no
          # NPM_TOKEN, confirmed live in run 29156278881). Skip semantic-release
          # entirely rather than pretend dry-run is a no-token-friendly mode.
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping release; add the secret to enable publishing."
            exit 0
          fi
          npx semantic-release
