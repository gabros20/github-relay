name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check (src)
        run: bun run typecheck

      - name: Type check (tests)
        run: bun run typecheck:tests

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Smoke-test the built MCP shim over real stdio (plain node, not bun)
        run: bun run smoke:mcp

      - name: Verify package contents
        run: npm pack --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  node-smoke:
    # Proves the built npm bins work under plain Node — no bun on this
    # runner at all (task 8b: doctor/auth/digest's exec seam and gh-rest's
    # tarball WriteSink used to default to Bun.spawn/Bun.file, which
    # `bun test` could never catch since bun provides those globals itself).
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Node-runtime smoke test (cli, doctor, gh-rest WriteSink, mcp-shim)
        run: node scripts/node-smoke.mjs
